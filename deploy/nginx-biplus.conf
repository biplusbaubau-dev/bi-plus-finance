# ==========================================================
# ALTERNATIF bila nginx di VPS sudah dipakai website lain dan
# TIDAK boleh dimatikan.
#
# Arsitektur:
#   Internet -> nginx :443 (TLS + Basic Auth) -> app :3000 (Docker)
#   Caddy dinonaktifkan sepenuhnya.
#
# Pasang:
#   1. cp deploy/nginx-biplus.conf /etc/nginx/sites-available/biplus
#   2. nano /etc/nginx/sites-available/biplus     (ganti domain & password)
#   3. ln -s /etc/nginx/sites-available/biplus /etc/nginx/sites-enabled/
#   4. docker compose up -d app migrate           (caddy tidak dipakai)
#   5. apt install -y certbot python3-certbot-nginx
#      certbot --nginx -d biplus.my.id
#   6. nginx -t && systemctl reload nginx
#
# CATATAN: baris `listen 80` di bawah SENGAJA tidak ada, karena nginx
# milikmu sudah memegang port 80. Certbot akan menambahkan sendiri
# blok redirect HTTP->HTTPS setelah sertifikat terbit.
# ==========================================================

# Hash password: buat dengan
#   docker run --rm httpd:alpine htpasswd -nbB biplus 'PASSWORD'
# Contoh di bawah: user "biplus", password "ganti-ini"
# Tempel hasilnya di dalam tanda kutip pada auth_basic_user_file.
#
# Simpan hash ke file terpisah:
#   echo 'biplus:$2y$05$HASIL' > /etc/nginx/.htpasswd-biplus
#   chmod 640 /etc/nginx/.htpasswd-biplus

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name biplus.my.id;

    # Sertifikat diisi otomatis oleh certbot. Baris ini bisa dikomentari
    # pada percobaan pertama sebelum certbot dijalankan.
    # ssl_certificate     /etc/letsencrypt/live/biplus.my.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/biplus.my.id/privkey.pem;

    # ---------- proteksi login ----------
    auth_basic           "BI+ Finance";
    auth_basic_user_file /etc/nginx/.htpasswd-biplus;

    # ---------- keamanan ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    server_tokens off;

    # ---------- upload foto unit ----------
    client_max_body_size 8M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Next.js server actions & streaming
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
